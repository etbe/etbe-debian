ClientAliveInterval 60
ClientAliveCountMax 5
AllowGroups sshusers

# see https://www.ssh-audit.com/ https://github.com/jtesta/ssh-audit
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
KexAlgorithms -ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group14-sha256,curve25519-sha256,curve25519-sha256@libssh.org
MACs -umac-64-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512,hmac-sha1
