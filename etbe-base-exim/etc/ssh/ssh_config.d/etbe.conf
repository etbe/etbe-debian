ServerAliveInterval 60
ServerAliveCountMax 6
Compression yes
HashKnownHosts no

# see https://www.ssh-audit.com/ https://github.com/jtesta/ssh-audit
HostKeyAlgorithms=-ecdsa-sha2-nistp*,sk-ecdsa-sha2-nistp256*,ecdsa-sha2-nistp*
KexAlgorithms=-ecdh-sha2-nistp*,curve25519-sha256*,diffie-hellman-group*
MACs=-umac-64-etm@openssh.com,hmac-sha1-etm@openssh.com,umac-64@openssh.com,hmac-sha1,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512
Ciphers=-chacha20-poly1305@openssh.com
